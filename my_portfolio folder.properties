<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mary Atieno Odhiambo | Portfolio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

:root {
    --primary: #2563eb;
    --dark: #101b3b;
    --light: #f5f8ff;
    --text: #334155;
    --muted: #64748b;
    --white: #ffffff;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--light);
    color: var(--text);
    line-height: 1.7;
}

/* NAVIGATION */

nav {
    background: #ffffff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 8%;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 3px 15px rgba(0,0,0,0.06);
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: var(--primary);
}

nav ul {
    display: flex;
    list-style: none;
    gap: 28px;
}

nav ul a {
    text-decoration: none;
    color: var(--dark);
    font-weight: 600;
    font-size: 14px;
}

nav ul a:hover {
    color: var(--primary);
}

/* HERO SECTION */

.hero {
    min-height: 570px;
    background: linear-gradient(120deg, #101b3b, #1e40af);
    display: flex;
    align-items: center;
    padding: 80px 10%;
    color: white;
}

.hero-content {
    max-width: 750px;
}

.hero-tag {
    display: inline-block;
    background: rgba(255,255,255,0.12);
    padding: 8px 18px;
    border-radius: 30px;
    margin-bottom: 25px;
    color: #bfdbfe;
}

.hero h1 {
    font-size: clamp(36px, 6vw, 60px);
    line-height: 1.2;
    margin-bottom: 20px;
}

.hero h1 span {
    color: #60a5fa;
}

.hero p {
    font-size: 17px;
    color: #dbeafe;
    max-width: 600px;
    margin-bottom: 30px;
}

.button {
    display: inline-block;
    padding: 13px 25px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    margin: 5px;
    transition: 0.3s;
}

.button:hover {
    transform: translateY(-4px);
}

.primary-btn {
    background: #3b82f6;
    color: white;
}

.secondary-btn {
    border: 1px solid white;
    color: white;
}

/* GENERAL SECTIONS */

section {
    padding: 85px 9%;
}

.section-title {
    text-align: center;
    margin-bottom: 45px;
}

.section-title h2 {
    font-size: 32px;
    color: var(--dark);
    margin-bottom: 10px;
}

.section-title p {
    color: var(--muted);
}

.line {
    width: 60px;
    height: 4px;
    background: var(--primary);
    margin: 12px auto;
    border-radius: 10px;
}

/* OVERVIEW */

.about {
    background: white;
}

.about-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 45px;
    align-items: center;
}

.about-text h3 {
    font-size: 25px;
    color: var(--dark);
    margin-bottom: 18px;
}

.about-text p {
    color: var(--muted);
    margin-bottom: 15px;
}

.about-card {
    background: linear-gradient(145deg,#eff6ff,#dbeafe);
    padding: 45px 30px;
    border-radius: 20px;
    text-align: center;
    border: 1px solid #bfdbfe;
}

.about-card .symbol {
    font-size: 65px;
    margin-bottom: 15px;
}

.about-card h3 {
    color: var(--dark);
    font-size: 23px;
}

.about-card p {
    color: var(--muted);
    margin-top: 10px;
}

/* FEATURES */

.features {
    background: #f5f8ff;
}

.feature-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
    gap: 25px;
}

.feature-card {
    background: white;
    padding: 32px 25px;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    transition: 0.3s;
    border: 1px solid #e5eaf5;
}

.feature-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 25px rgba(37,99,235,0.12);
}

.feature-icon {
    width: 58px;
    height: 58px;
    background: #eff6ff;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    margin-bottom: 20px;
}

.feature-card h3 {
    color: var(--dark);
    margin-bottom: 12px;
}

.feature-card p {
    color: var(--muted);
    font-size: 14px;
}

/* SKILLS */

.skills {
    background: white;
}

.skill-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
}

.skill {
    background: #eff6ff;
    color: #1d4ed8;
    padding: 14px 25px;
    border-radius: 10px;
    font-weight: 600;
    border: 1px solid #dbeafe;
}

/* PROJECTS */

.projects {
    background: #f5f8ff;
}

.project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
    gap: 25px;
}

.project-card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    border: 1px solid #e2e8f0;
}

.project-card h3 {
    color: var(--dark);
    margin-bottom: 12px;
}

.project-card p {
    color: var(--muted);
}

/* FUTURE GOALS */

.goals {
    background: white;
}

.goal-box {
    max-width: 750px;
    margin: auto;
    background: #eff6ff;
    border-left: 5px solid var(--primary);
    padding: 30px;
    border-radius: 12px;
}

.goal-box p {
    color: var(--muted);
}

/* FOOTER */

footer {
    background: #101b3b;
    color: white;
    text-align: center;
    padding: 35px 20px;
}

footer p {
    color: #bfdbfe;
    margin: 5px;
}

@media(max-width:750px) {
    nav {
        flex-direction: column;
        gap: 12px;
    }

    nav ul {
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .hero {
        padding: 75px 7%;
        min-height: 500px;
    }

    .about-container {
        grid-template-columns: 1fr;
    }

    section {
        padding: 65px 7%;
    }
}
</style>
</head>

<body>

<!-- NAVIGATION -->

<nav>
    <div class="logo">Mary.dev</div>


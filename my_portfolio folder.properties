<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mary | Computer Science Portfolio</title>
  <meta name="description" content="Portfolio of Mary, a computer science student who builds clean, useful software and websites.">
  <meta name="theme-color" content="#0D1B2A">

  <!-- Favicon -->
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">

  <!-- Custom fonts (Google Fonts): Fraunces for headings, DM Sans for body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&display=swap">

  <!-- Stylesheet (sections inside: tokens, layout, components, animations) -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Small enhancements only; the site works without JavaScript -->
  <script src="js/main.js" defer></script>
</head>

<body id="top">
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- ========== HEADER / NAVIGATION ========== -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="#home" aria-label="Mary, go to the top of the page">Mary<span class="brand__dot">.</span></a>

      <nav class="site-nav" aria-label="Main navigation">
        <ul class="site-nav__list">
          <li><a href="#about">About</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">

    <!-- ========== HERO ========== -->
    <section class="hero" id="home" aria-labelledby="hero-title">
      <div class="container hero__inner">
        <div class="hero__text">
          <p class="hero__eyebrow">Computer Science Student</p>
          <h1 class="hero__title" id="hero-title">Hi, I'm Mary. I turn <span class="hero__highlight">ideas</span> into working software.</h1>
          <p class="hero__lead">I'm studying computer science and building small projects that solve real problems, from algorithm tools to clean, responsive websites.</p>
          <div class="hero__actions">
            <a class="btn btn--primary" href="#projects">See my projects</a>
            <a class="btn btn--ghost" href="#contact">Get in touch</a>
          </div>
        </div>

        <figure class="hero__figure">
          <img src="images/profile-placeholder.svg" alt="Illustrated avatar of Mary" width="400" height="400">
          <figcaption class="hero__badge">Always learning</figcaption>
        </figure>
      </div>
    </section>

    <!-- ========== ABOUT ========== -->
    <section class="section about" id="about" aria-labelledby="about-title">
      <div class="container about__grid">
        <header class="section__header">
          <p class="section__eyebrow">About me</p>
          <h2 id="about-title">Curious, careful and always building</h2>
        </header>

        <article class="card about__story">
          <h3 class="visually-hidden">My story</h3>
          <!-- Replace this text with your own story -->
          <p>I'm a computer science student who enjoys breaking big problems into small, testable pieces. I like the moment a messy idea turns into code that actually runs.</p>
          <p>I'm learning how data structures and algorithms shape the software we use every day, and I practise by building projects, revising often and sharing my work on GitHub.</p>
        </article>

        <aside class="card about__facts" aria-label="Quick facts">
          <dl>
            <dt>Studying</dt>
            <dd>Computer Science</dd>
            <dt>Interests</dt>
            <dd>Web development, data structures and algorithms</dd>
            <dt>Currently</dt>
            <dd>Building this portfolio</dd>
          </dl>
        </aside>
      </div>
    </section>

    <!-- ========== SKILLS ========== -->
    <section class="section section--tinted skills" id="skills" aria-labelledby="skills-title">
      <div class="container">
        <header class="section__header">
          <p class="section__eyebrow">Skills</p>
          <h2 id="skills-title">What I work with</h2>
        </header>

        <!-- Edit these chips so they match your real skills -->
        <div class="skills__grid">
          <article class="card skill-card">
            <h3>Languages</h3>
            <ul class="chips">
              <li>C++</li>
              <li>Python</li>
              <li>JavaScript</li>
              <li>SQL</li>
            </ul>
          </article>

          <article class="card skill-card">
            <h3>Web</h3>
            <ul class="chips">
              <li>HTML5</li>
              <li>CSS3</li>
              <li>Responsive design</li>
              <li>Accessibility</li>
            </ul>
          </article>

          <article class="card skill-card">
            <h3>Core CS</h3>
            <ul class="chips">
              <li>Data structures</li>
              <li>Algorithms</li>
              <li>Problem solving</li>
              <li>Git &amp; GitHub</li>
            </ul>
          </article>
        </div>
      </div>
    </section>

    <!-- ========== PROJECTS ========== -->
    <section class="section projects" id="projects" aria-labelledby="projects-title">
      <div class="container">
        <header class="section__header">
          <p class="section__eyebrow">Projects</p>
          <h2 id="projects-title">Things I've built</h2>
        </header>

        <!-- Placeholder projects: swap titles, text and links for your own -->
        <div class="projects__grid">
          <article class="project-card">
            <img class="project-card__img" src="images/project-planner.svg" alt="Illustration of a weekly study planner with coloured time blocks" width="600" height="400" loading="lazy">
            <span class="project-card__tag">HTML · CSS · JS</span>
            <div class="project-card__body">
              <h3>Study Planner</h3>
              <p>A weekly planner that helps students block out revision time and keep track of deadlines.</p>
              <a class="project-card__link" href="https://github.com/your-username/study-planner" target="_blank" rel="noopener noreferrer">View on GitHub <span aria-hidden="true">→</span></a>
            </div>
          </article>

          <article class="project-card">
            <img class="project-card__img" src="images/project-visualizer.svg" alt="Illustration of a bar chart showing a sorting algorithm in progress" width="600" height="400" loading="lazy">
            <span class="project-card__tag">C++ · Algorithms</span>
            <div class="project-card__body">
              <h3>Sorting Visualizer</h3>
              <p>Step-by-step animations of classic sorting algorithms to make time complexity easier to see.</p>
              <a class="project-card__link" href="https://github.com/your-username/sorting-visualizer" target="_blank" rel="noopener noreferrer">View on GitHub <span aria-hidden="true">→</span></a>
            </div>
          </article>

          <article class="project-card">
            <img class="project-card__img" src="images/project-notes.svg" alt="Illustration of a board covered with sticky notes" width="600" height="400" loading="lazy">
            <span class="project-card__tag">Python · SQL</span>
            <div class="project-card__body">
              <h3>Campus Notes Board</h3>
              <p>A simple app where classmates can share short notes and past-paper tips for each course unit.</p>
              <a class="project-card__link" href="https://github.com/your-username/campus-notes" target="_blank" rel="noopener noreferrer">View on GitHub <span aria-hidden="true">→</span></a>
            </div>
          </article>
        </div>
      </div>
    </section>

    <!-- ========== CONTACT ========== -->
    <section class="section section--tinted contact" id="contact" aria-labelledby="contact-title">
      <div class="container contact__grid">
        <header class="section__header contact__intro">
          <p class="section__eyebrow">Contact</p>
          <h2 id="contact-title">Let's work together</h2>
          <p>Have a question, an idea or an opportunity? Send me a message using the form and I'll reply as soon as I can.</p>
          <p class="contact__note"><span class="required" aria-hidden="true">*</span> marks a required field.</p>
        </header>

        <!--
          Form notes:
          - action="#" keeps the page static. To receive real messages, point action at a
            form service (Formspree, Netlify Forms, etc). See README.md.
          - data-netlify="true" is picked up automatically if you deploy on Netlify.
        -->
        <form class="form" id="contact-form" name="contact" action="#" method="post" data-netlify="true">
          <input type="hidden" name="form-name" value="contact">

          <fieldset class="form__group">
            <legend>About you</legend>

            <div class="form__row">
              <div class="form__field">
                <label for="full-name">Full name <span class="required" aria-hidden="true">*</span></label>
                <input type="text" id="full-name" name="full_name" placeholder="e.g. Amina Otieno" autocomplete="name" minlength="2" maxlength="60" required>
              </div>

              <div class="form__field">
                <label for="email">Email <span class="required" aria-hidden="true">*</span></label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
              </div>
            </div>

            <div class="form__row">
              <div class="form__field">
                <label for="phone">Phone (optional)</label>
                <input type="tel" id="phone" name="phone" placeholder="+254 700 000 000" autocomplete="tel" pattern="[0-9+\s\-]{7,18}" title="Use 7 to 18 characters: digits, spaces, + or -">
              </div>

              <div class="form__field">
                <label for="website">Website (optional)</label>
                <input type="url" id="website" name="website" placeholder="https://example.com" autocomplete="url">
              </div>
            </div>
          </fieldset>

          <fieldset class="form__group">
            <legend>Your message</legend>

            <div class="form__row">
              <div class="form__field">
                <label for="source">Sent from</label>
                <input type="text" id="source" name="source" value="Portfolio website" readonly>
              </div>

              <div class="form__field">
                <label for="topic">Topic <span class="required" aria-hidden="true">*</span></label>
                <select id="topic" name="topic" required>
                  <option value="" selected disabled>Choose a topic</option>
                  <optgroup label="Opportunities">
                    <option value="internship">Internship</option>
                    <option value="collaboration">Project collaboration</option>
                  </optgroup>
                  <optgroup label="Other">
                    <option value="feedback">Feedback on my work</option>
                    <option value="hello">Just saying hello</option>
                  </optgroup>
                </select>
              </div>
            </div>

            <fieldset class="form__radios">
              <legend>Preferred way to reply</legend>
              <label><input type="radio" name="reply_method" value="email" checked> Email</label>
              <label><input type="radio" name="reply_method" value="phone"> Phone</label>
              <label><input type="radio" name="reply_method" value="either"> Either is fine</label>
            </fieldset>

            <div class="form__row">
              <div class="form__field">
                <label for="call-date">Preferred date for a chat</label>
                <input type="date" id="call-date" name="call_date">
              </div>

              <div class="form__field">
                <label for="timeline">Ideal timeline: <output id="timeline-output" for="timeline">4 weeks</output></label>
                <input type="range" id="timeline" name="timeline_weeks" min="1" max="12" step="1" value="4">
              </div>
            </div>

            <div class="form__field">
              <label for="message">Message <span class="required" aria-hidden="true">*</span></label>
              <textarea id="message" name="message" rows="5" minlength="10" maxlength="500" placeholder="Tell me a little about what you have in mind..." required></textarea>
              <span class="form__counter" id="message-count">0 / 500</span>
            </div>

            <label class="form__consent">
              <input type="checkbox" id="consent" name="consent" value="yes" required>
              <span>I agree to be contacted about this message. <span class="required" aria-hidden="true">*</span></span>
            </label>
          </fieldset>

          <div class="form__actions">
            <button type="submit" class="btn btn--primary">Send message</button>
            <button type="reset" class="btn btn--ghost">Clear form</button>
          </div>

          <p class="form__status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>&copy; <span id="year">2026</span> Mary. Built with HTML, CSS and a little JavaScript.</p>
      <nav aria-label="Social links">
        <ul class="site-footer__links">
          <li><a href="https://github.com/your-username" target="_blank" rel="noopener noreferrer">GitHub</a></li>
          <li><a href="https://www.linkedin.com/in/your-username" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
        </ul>
      </nav>
    </div>
  </footer>

  <a class="back-to-top" href="#top" aria-label="Back to top"><span aria-hidden="true">↑</span></a>
</body>
</html>
